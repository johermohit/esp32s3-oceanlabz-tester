; Standalone TFT screen test: ESP32-S3 DevKit wired DIRECTLY to the 1.8" QDTech module (no expansion board).
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter, default
monitor_eol = LF
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

; Screen back on the OceanLabz expansion board. No serial; the screen loops through the drivers by itself.
; Use:  pio run -e kit -t upload
[env:kit]
extends = env:esp32s3
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0 -DKIT
