[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.9

; Fallback when the board's second USB-C does not enumerate (only the CH343 UART bridge, VID 1A86, shows up).
; Console is then UART0 on GPIO43/44, which the TFT also uses: the firmware prints BEFORE each TFT try,
; hands the pins to the TFT, then re-attaches the console. Watch the panel; it prints the pin mapping on itself.
; Use:  pio run -e esp32s3_uart -t upload
[env:esp32s3_uart]
extends = env:esp32s3
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
